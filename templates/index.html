<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parfumerie Product Downloader</title><style>body{font:16px system-ui;background:#f4f6fa;color:#172033;margin:0}.wrap{max-width:850px;margin:35px auto;padding:20px}.card{background:white;padding:25px;border-radius:14px;box-shadow:0 2px 18px #17203310;margin:15px 0}input,button{padding:12px;border-radius:8px;border:1px solid #ccd3df;font:inherit}input{max-width:100%;box-sizing:border-box}button{background:#172b65;color:white;cursor:pointer;border:0;margin:6px 6px 6px 0}button:disabled{opacity:.5}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#eef2fa;padding:15px;border-radius:8px;text-align:center}.stat b{font-size:25px;display:block}small{color:#526075}#msg{white-space:pre-wrap}@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><h1>Parfumerie Product Downloader</h1><p>Thu thập sản phẩm công khai từ parfumerie.vn, xuất CSV và tải ảnh khi được phép.</p><div class="card"><label>Mã quản trị (ADMIN_TOKEN)<br><input id="token" type="password" placeholder="Nhập mã quản trị" style="width:100%;margin:8px 0"></label><p><label>Giới hạn số trang <input id="max" type="number" min="1" max="20000" value="5000"></label></p><label><input id="download" type="checkbox" checked> Tải file hình ảnh</label><p><button onclick="call('start')">Bắt đầu quét</button><button onclick="call('stop')">Dừng</button><button onclick="exportZip()">Tải ZIP</button></p><small>Chỉ quét trang được robots.txt cho phép; không dùng để vượt kiểm soát truy cập.</small></div><div class="card"><div class="stats"><div class="stat"><b id="pages">0</b>Trang</div><div class="stat"><b id="products">0</b>Sản phẩm</div><div class="stat"><b id="images">0</b>URL ảnh</div><div class="stat"><b id="errors">0</b>Lỗi</div></div><p id="msg">Chưa bắt đầu</p></div></div><script>const headers=()=>({'X-Admin-Token':document.getElementById('token').value});async function call(action){try{const r=await fetch('/api/'+action,{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({max_pages:Number(document.getElementById('max').value),download:document.getElementById('download').checked})});if(!r.ok)throw Error(await r.text());await refresh()}catch(e){document.getElementById('msg').textContent=e.message}}async function refresh(){if(!document.getElementById('token').value)return;try{const r=await fetch('/api/status',{headers:headers()});if(!r.ok)return;const d=await r.json();for(const k of ['pages','products','images','errors'])document.getElementById(k).textContent=d[k];document.getElementById('msg').textContent=d.message+(d.running?' (đang chạy)':'')}catch(e){}}async function exportZip(){try{const r=await fetch('/api/export',{headers:headers()});if(!r.ok)throw Error(await r.text());const u=URL.createObjectURL(await r.blob());const a=document.createElement('a');a.href=u;a.download='parfumerie-products.zip';a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)}catch(e){document.getElementById('msg').textContent=e.message}}setInterval(refresh,3000)</script></body></html>
